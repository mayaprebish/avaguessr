<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVAGUESSR</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
        <div class="title">
            <img src="images/avatitle.png"/>
            <h1 id="title">WHICH PICTURE IS AVA?</h1>
        </div>
        <div class="content">
            <div class="results invisible" id="results">
              <h1 class="result" id="result"></h1>
              <button id="playAgain">PLAY AGAIN</button>
            </div>
            <div class="game">
              <div class="options" id="options">
                <div class="option" id="option1">
                    <img id="option1img"/>
                </div>
                <div class="option" id="option2">
                  <img id="option2img"/>
                </div>
            </div>
                <button id="next" class="invisible">NEXT</button>
            </div>
            
        </div>
    </main>
    <script src="./scripts/index.js"></script>
  </body>
</html>
